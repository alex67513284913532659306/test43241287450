<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC2 VPN — Доступ заблокирован</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0d1525 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(26, 31, 46, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff4444;
            font-size: 28px;
            margin-bottom: 16px;
            font-weight: 700;
        }
        .rule {
            color: #ffaa44;
            font-weight: 600;
        }
        p {
            color: #b0b8d0;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .divider {
            height: 1px;
            background: rgba(255,255,255,0.1);
            margin: 24px 0;
        }
        .footer {
            font-size: 12px;
            color: #5a6279;
        }
        .badge {
            display: inline-block;
            background: rgba(255,68,68,0.2);
            color: #ff6666;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⛔</div>
        <div class="badge">PC2 VPN</div>
        <h1>Доступ заблокирован</h1>
        <p>
            Данный домен <span class="rule">заблокирован</span> в соответствии 
            с правилами использования <b>PC2 VPN</b>.
        </p>
        <p>
            Сервис предоставляется <b>ТОЛЬКО</b> для игры<br>
            <span class="rule">Pixel Combats 2</span>.
        </p>
        <p>
            ❌ YouTube<br>
            ❌ TikTok<br>
            ❌ Telegram<br>
            и другие сайты — не доступны через данный VPN.
        </p>
        <div class="divider"></div>
        <p class="footer">
            PC2 VPN
        </p>
    </div>
</body>
</html>
