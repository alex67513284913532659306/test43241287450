<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открытие приложения</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #161b22;
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid #30363d;
        }
        .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #f0f6fc;
        }
        .subtitle {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: #2ea043;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            text-decoration: none;
        }
        .btn:hover {
            background: #3fb950;
        }
        .btn-secondary {
            background: #21262d;
            border: 1px solid #30363d;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background: #30363d;
        }
        .link-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px 16px;
            margin: 16px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: #58a6ff;
            text-align: left;
            user-select: all;
        }
        .status {
            font-size: 14px;
            color: #8b949e;
            margin: 12px 0;
        }
        .status.success {
            color: #3fb950;
        }
        .status.error {
            color: #f85149;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔐</div>
        <h2>Открытие подписки</h2>
        <p class="subtitle">Сейчас откроется приложение для импорта</p>

        <div id="status" class="status">⏳ Подготовка...</div>

        <div id="link-container" class="hidden">
            <div class="link-box" id="link-display"></div>
            <button class="btn" id="open-btn">📥 Открыть в приложении</button>
            <button class="btn btn-secondary" id="copy-btn">📋 Копировать ссылку</button>
        </div>

        <div id="error-container" class="hidden">
            <div class="status error">❌ Не удалось открыть приложение</div>
            <p style="font-size: 13px; color: #8b949e; margin: 8px 0 16px;">
                Убедитесь, что приложение установлено, или скопируйте ссылку вручную.
            </p>
        </div>

        <p style="font-size: 12px; color: #8b949e; margin-top: 20px;">
            Если приложение не открывается, нажмите «Открыть в приложении» повторно
        </p>
    </div>

    <script>
        // Получаем параметр sub из URL
        const urlParams = new URLSearchParams(window.location.search);
        const sub = urlParams.get('sub');

        const status = document.getElementById('status');
        const linkContainer = document.getElementById('link-container');
        const linkDisplay = document.getElementById('link-display');
        const openBtn = document.getElementById('open-btn');
        const copyBtn = document.getElementById('copy-btn');
        const errorContainer = document.getElementById('error-container');

        let redirectAttempted = false;

        function openApp() {
            if (!sub) return;

            try {
                // Пробуем открыть через location
                window.location.href = sub;
                redirectAttempted = true;
                status.textContent = '🔄 Открываем приложение...';
                status.className = 'status';

                // Если через 3 секунды ничего не произошло
                setTimeout(() => {
                    if (redirectAttempted) {
                        status.textContent = '⚠️ Приложение не открылось';
                        status.className = 'status error';
                        errorContainer.classList.remove('hidden');
                        linkContainer.classList.remove('hidden');
                    }
                }, 3000);

            } catch (e) {
                status.textContent = '❌ Ошибка: ' + e.message;
                status.className = 'status error';
                errorContainer.classList.remove('hidden');
                linkContainer.classList.remove('hidden');
            }
        }

        if (sub && sub.startsWith('happ://')) {
            // Показываем ссылку
            linkDisplay.textContent = sub;
            linkContainer.classList.remove('hidden');

            // Автоматически пробуем открыть через 1 секунду
            setTimeout(openApp, 1000);

            // Кнопка "Открыть в приложении"
            openBtn.addEventListener('click', function() {
                errorContainer.classList.add('hidden');
                status.textContent = '🔄 Повторная попытка...';
                status.className = 'status';
                openApp();
            });

            // Кнопка "Копировать"
            copyBtn.addEventListener('click', function() {
                navigator.clipboard.writeText(sub).then(() => {
                    copyBtn.textContent = '✅ Скопировано!';
                    setTimeout(() => {
                        copyBtn.textContent = '📋 Копировать ссылку';
                    }, 2000);
                }).catch(() => {
                    // Fallback
                    const textarea = document.createElement('textarea');
                    textarea.value = sub;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    copyBtn.textContent = '✅ Скопировано!';
                    setTimeout(() => {
                        copyBtn.textContent = '📋 Копировать ссылку';
                    }, 2000);
                });
            });

        } else {
            status.textContent = sub ? '❌ Неверная ссылка' : '❌ Ссылка не найдена';
            status.className = 'status error';
        }
    </script>
</body>
</html>
