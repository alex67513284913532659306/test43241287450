<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PC2 VPN - Импорт</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #0a0a0f 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 32px 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #6C3CE1, #E040FB);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            box-shadow: 0 8px 32px rgba(108, 60, 225, 0.4);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 60%, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .happ-link-box {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            word-break: break-all;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-align: left;
        }
        .btn-import {
            display: block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(145deg, #6C3CE1, #E040FB);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            margin-top: 8px;
            box-shadow: 0 8px 30px rgba(108, 60, 225, 0.35);
        }
        .btn-import:active { transform: scale(0.96); }
        .btn-copy {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
        }
        .btn-copy:active { background: rgba(255, 255, 255, 0.05); }
        .btn-copy.copied { color: #34d399; border-color: #34d399; }
        .error {
            color: #f87171;
            font-size: 14px;
            margin: 16px 0;
            padding: 12px;
            background: rgba(248, 113, 113, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(248, 113, 113, 0.2);
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">🎯</div>
    <h1>PC2 VPN</h1>
    <p class="subtitle">Импорт подписки для Pixel Combats 2</p>

    <div id="content">
        <!-- Контент будет вставлен сюда -->
    </div>

    <div class="footer">Pixel Combats 2 VPN • Бесплатно</div>
</div>

<script>
    // Получаем полный URL и извлекаем параметр sub
    const urlParams = new URLSearchParams(window.location.search);
    let subValue = urlParams.get('sub');

    // Функция для показа ошибки
    function showError(message) {
        document.getElementById('content').innerHTML = `
            <div class="error">❌ ${message}</div>
            <button class="btn-import" onclick="window.location.reload()">↻ Попробовать снова</button>
        `;
    }

    // Если параметра sub нет
    if (!subValue) {
        showError('Не указана подписка.');
    } else {
        // Декодируем URL-кодировку (если есть)
        try {
            subValue = decodeURIComponent(subValue);
        } catch(e) {}

        // Проверяем, начинается ли ссылка с happ://
        if (subValue.startsWith('happ://')) {
            // ИЗВЛЕКАЕМ ССЫЛКУ И ДЕЛАЕМ ПРЯМУЮ ССЫЛКУ
            document.getElementById('content').innerHTML = `
                <div style="text-align: center; margin: 20px 0;">
                    <div style="font-size: 48px; margin-bottom: 16px;">🔗</div>
                    <p style="color: rgba(255,255,255,0.7); margin-bottom: 20px; font-size: 14px;">
                        Готово! Нажмите кнопку ниже, чтобы импортировать подписку
                    </p>
                    <a href="${subValue}" class="btn-import" id="importBtn">
                        📥 ИМПОРТИРОВАТЬ В HAPP
                    </a>
                    <button class="btn-copy" id="copyBtn">📋 Скопировать ссылку</button>
                </div>
            `;

            // Копирование ссылки
            document.getElementById('copyBtn').addEventListener('click', async function() {
                try {
                    await navigator.clipboard.writeText(subValue);
                    this.textContent = '✅ Скопировано!';
                    this.classList.add('copied');
                    setTimeout(() => {
                        this.textContent = '📋 Скопировать ссылку';
                        this.classList.remove('copied');
                    }, 2000);
                } catch(e) {
                    alert('Не удалось скопировать. Скопируйте вручную:\n' + subValue);
                }
            });

        } else if (subValue.startsWith('http://') || subValue.startsWith('https://')) {
            // Обычная HTTP ссылка — пытаемся получить информацию (ваш старый код)
            document.getElementById('content').innerHTML = `
                <div style="text-align: center; padding: 20px 0;">
                    <div class="loader" style="width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top:3px solid #6C3CE1;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px;"></div>
                    <p style="color: rgba(255,255,255,0.5);">Загрузка подписки...</p>
                </div>
                <style>
                    @keyframes spin {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                    }
                </style>
            `;

            // Здесь ваш старый код для fetch()
            fetch(subValue + '?format=info')
                .then(response => response.json())
                .then(data => {
                    // Показываем информацию о подписке
                    const isActive = data.enable !== false;
                    const totalGB = data.totalGB ? (data.totalGB / 1024 / 1024 / 1024).toFixed(1) : 10;
                    const usedGB = data.usedGB ? data.usedGB.toFixed(1) : 0;
                    const progress = Math.min((usedGB / totalGB) * 100, 100);

                    document.getElementById('content').innerHTML = `
                        <div class="status-card" style="background:rgba(255,255,255,0.06);border-radius:16px;padding:20px;margin-bottom:24px;border:1px solid rgba(255,255,255,0.06);">
                            <div class="status-row" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
                                <span style="color:rgba(255,255,255,0.5);font-size:13px;">📊 Статус</span>
                                <span style="font-weight:600;font-size:13px;color:${isActive ? '#34d399' : '#f87171'};">${isActive ? '● Активна' : '● Истекла'}</span>
                            </div>
                            <div class="status-row" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
                                <span style="color:rgba(255,255,255,0.5);font-size:13px;">📅 Действует до</span>
                                <span style="font-weight:600;font-size:13px;">${data.expiryTime ? new Date(data.expiryTime).toLocaleDateString('ru-RU') : '--'}</span>
                            </div>
                            <div class="status-row" style="display:flex;justify-content:space-between;padding:8px 0;">
                                <span style="color:rgba(255,255,255,0.5);font-size:13px;">📊 Пакет</span>
                                <span style="font-weight:600;font-size:13px;">${totalGB} ГБ</span>
                            </div>
                        </div>
                        <div style="margin:16px 0;">
                            <div style="width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;">
                                <div style="height:100%;border-radius:3px;background:linear-gradient(90deg,#6C3CE1,#E040FB);width:${progress}%;transition:width 0.5s ease;"></div>
                            </div>
                            <div style="display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,0.5);margin-top:6px;">
                                <span>${usedGB} ГБ</span>
                                <span>${totalGB} ГБ</span>
                            </div>
                        </div>
                        <a href="${subValue}" class="btn-import">📥 ИМПОРТИРОВАТЬ</a>
                        <button class="btn-copy" id="copyBtn">📋 Скопировать ссылку</button>
                    `;

                    // Копирование
                    document.getElementById('copyBtn').addEventListener('click', async function() {
                        try {
                            await navigator.clipboard.writeText(subValue);
                            this.textContent = '✅ Скопировано!';
                            this.classList.add('copied');
                            setTimeout(() => {
                                this.textContent = '📋 Скопировать ссылку';
                                this.classList.remove('copied');
                            }, 2000);
                        } catch(e) {
                            alert('Не удалось скопировать. Скопируйте вручную:\n' + subValue);
                        }
                    });
                })
                .catch(() => {
                    showError('Не удалось загрузить информацию о подписке.');
                });

        } else {
            showError('Неверный формат подписки.');
        }
    }
</script>

</body>
</html>
