<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PC2 VPN - Импорт</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #0a0a0f 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 32px 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #6C3CE1, #E040FB);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            box-shadow: 0 8px 32px rgba(108, 60, 225, 0.4);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 60%, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .btn-import {
            display: block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(145deg, #6C3CE1, #E040FB);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            margin-top: 8px;
            box-shadow: 0 8px 30px rgba(108, 60, 225, 0.35);
        }
        .btn-import:active { transform: scale(0.96); }
        .btn-import:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .error {
            color: #f87171;
            font-size: 14px;
            margin: 16px 0;
            padding: 12px;
            background: rgba(248, 113, 113, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(248, 113, 113, 0.2);
        }
        .info-box {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px;
            margin: 16px 0 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .info-box p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            line-height: 1.5;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
        }
        .hidden { display: none !important; }
        .app-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        /* Google Play Button */
        .google-play-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #000;
            color: #fff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .google-play-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.4);
        }
        .google-play-btn:active {
            transform: scale(0.96);
        }
        .google-play-btn svg {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }
        .google-play-btn .btn-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.2;
        }
        .google-play-btn .btn-text .small {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .google-play-btn .btn-text .big {
            font-size: 18px;
            font-weight: 700;
        }

        /* Retry button */
        .btn-retry {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
            text-decoration: none;
            text-align: center;
        }
        .btn-retry:active {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Loader */
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #6C3CE1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Status card */
        .status-card {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: left;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .status-row:last-child {
            border-bottom: none;
        }
        .status-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }
        .status-value {
            font-weight: 600;
            font-size: 13px;
        }
        .status-value.active { color: #34d399; }
        .status-value.expired { color: #f87171; }

        .progress-container {
            margin: 16px 0;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #6C3CE1, #E040FB);
            transition: width 0.5s ease;
        }
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">🎯</div>
    <h1>PC2 VPN</h1>
    <p class="subtitle">Импорт подписки для Pixel Combats 2</p>

    <div id="content">
        <!-- Контент будет вставлен сюда -->
    </div>

    <div class="footer">Pixel Combats 2 VPN • Бесплатно</div>
</div>

<script>
    // Получаем параметр sub из URL
    const urlParams = new URLSearchParams(window.location.search);
    let subValue = urlParams.get('sub');

    // Функция для показа ошибки
    function showError(message) {
        document.getElementById('content').innerHTML = `
            <div class="error">❌ ${message}</div>
            <button class="btn-import" onclick="window.location.reload()">↻ Попробовать снова</button>
        `;
    }

    // Функция для показа сообщения об отсутствии HAPP с кнопкой Google Play
    function showNoHappMessage() {
        document.getElementById('content').innerHTML = `
            <div class="info-box">
                <span class="app-icon">📱</span>
                <p style="margin-bottom: 16px; text-align: center;">
                    У вас не установлено приложение <strong>HAPP</strong>.<br>
                    Оно необходимо для импорта подписки.
                </p>
            </div>

            <!-- Кнопка Google Play -->
            <a href="https://play.google.com/store/apps/details?id=com.happproxy" 
               class="google-play-btn" 
               target="_blank">
                <svg viewBox="0 0 512 512">
                    <path fill="#34A853" d="M48 464L368 144L48 464z"/>
                    <path fill="#EA4335" d="M48 464L368 144L48 464z" transform="scale(-1,1) translate(-512,0)"/>
                    <path fill="#4285F4" d="M48 464L288 224L48 464z"/>
                    <path fill="#34A853" d="M48 464L288 224L48 464z" transform="scale(-1,1) translate(-512,0)"/>
                    <path fill="#FBBC04" d="M48 464L288 224L48 464z"/>
                    <path fill="#EA4335" d="M48 464L288 224L48 464z"/>
                    <path fill="#34A853" d="M48 464L288 224L48 464z" transform="scale(-1,1) translate(-512,0)"/>
                    <path fill="#4285F4" d="M48 464L288 224L48 464z"/>
                    <path fill="#FBBC04" d="M48 464L288 224L48 464z" transform="scale(-1,1) translate(-512,0)"/>
                    <path fill="#EA4335" d="M48 464L288 224L48 464z"/>
                    <path fill="#34A853" d="M48 464L288 224L48 464z" transform="scale(-1,1) translate(-512,0)"/>
                    <path fill="#4285F4" d="M48 464L288 224L48 464z"/>
                    <path fill="#FBBC04" d="M48 464L288 224L48 464z" transform="scale(-1,1) translate(-512,0)"/>
                    <path fill="#EA4335" d="M48 464L288 224L48 464z"/>
                </svg>
                <span class="btn-text">
                    <span class="small">Доступно в</span>
                    <span class="big">Google Play</span>
                </span>
            </a>

            <div style="margin-top: 16px; font-size: 13px; color: rgba(255,255,255,0.3);">
                После установки нажмите кнопку ниже
            </div>
            <button class="btn-retry" id="retryBtn">
                🔄 Повторить импорт
            </button>
        `;

        // Повторная попытка импорта
        document.getElementById('retryBtn').addEventListener('click', function() {
            // Пытаемся открыть HAPP снова
            window.location.href = subValue;
            
            // Через 2 секунды показываем сообщение, если не открылось
            setTimeout(() => {
                showNoHappMessage();
            }, 2000);
        });
    }

    // Если параметра sub нет
    if (!subValue) {
        showError('Не указана подписка.');
    } else {
        // Декодируем URL-кодировку (если есть)
        try {
            subValue = decodeURIComponent(subValue);
        } catch(e) {}

        // Проверяем, начинается ли ссылка с happ://
        if (subValue.startsWith('happ://')) {
            // Показываем кнопку импорта
            document.getElementById('content').innerHTML = `
                <div style="text-align: center; margin: 20px 0;">
                    <div style="font-size: 48px; margin-bottom: 16px;">🔗</div>
                    <p style="color: rgba(255,255,255,0.7); margin-bottom: 20px; font-size: 14px;">
                        Нажмите кнопку, чтобы импортировать подписку в HAPP
                    </p>
                    <a href="${subValue}" class="btn-import" id="importBtn">
                        📥 ИМПОРТИРОВАТЬ В HAPP
                    </a>
                </div>
            `;

            // Обработка клика по кнопке
            document.getElementById('importBtn').addEventListener('click', function(e) {
                // Через 3 секунды проверяем, остались ли мы на странице
                setTimeout(() => {
                    showNoHappMessage();
                }, 3000);
            });

        } else if (subValue.startsWith('http://') || subValue.startsWith('https://')) {
            // Обычная HTTP ссылка — пытаемся получить информацию (API)
            document.getElementById('content').innerHTML = `
                <div style="text-align: center; padding: 20px 0;">
                    <div class="loader"></div>
                    <p style="color: rgba(255,255,255,0.5);">Загрузка подписки...</p>
                </div>
            `;

            fetch(subValue + '?format=info')
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(data => {
                    const isActive = data.enable !== false;
                    const totalGB = data.totalGB ? (data.totalGB / 1024 / 1024 / 1024).toFixed(1) : 10;
                    const usedGB = data.usedGB ? data.usedGB.toFixed(1) : 0;
                    const progress = Math.min((usedGB / totalGB) * 100, 100);

                    document.getElementById('content').innerHTML = `
                        <div class="status-card">
                            <div class="status-row">
                                <span class="status-label">📊 Статус</span>
                                <span class="status-value ${isActive ? 'active' : 'expired'}">${isActive ? '● Активна' : '● Истекла'}</span>
                            </div>
                            <div class="status-row">
                                <span class="status-label">📅 Действует до</span>
                                <span class="status-value">${data.expiryTime ? new Date(data.expiryTime).toLocaleDateString('ru-RU') : '--'}</span>
                            </div>
                            <div class="status-row">
                                <span class="status-label">📊 Пакет</span>
                                <span class="status-value">${totalGB} ГБ</span>
                            </div>
                        </div>
                        <div class="progress-container">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%;"></div>
                            </div>
                            <div class="progress-text">
                                <span>${usedGB} ГБ</span>
                                <span>${totalGB} ГБ</span>
                            </div>
                        </div>
                        <a href="${subValue}" class="btn-import" id="importBtnHttp">
                            📥 ИМПОРТИРОВАТЬ
                        </a>
                    `;

                    // Обработка клика для HTTP ссылки
                    document.getElementById('importBtnHttp').addEventListener('click', function(e) {
                        setTimeout(() => {
                            showNoHappMessage();
                        }, 3000);
                    });
                })
                .catch(() => {
                    // Если API не отвечает, просто показываем кнопку импорта
                    document.getElementById('content').innerHTML = `
                        <div style="text-align: center; margin: 20px 0;">
                            <p style="color: rgba(255,255,255,0.7); margin-bottom: 20px; font-size: 14px;">
                                Нажмите кнопку, чтобы импортировать подписку
                            </p>
                            <a href="${subValue}" class="btn-import" id="importBtnFallback">
                                📥 ИМПОРТИРОВАТЬ
                            </a>
                        </div>
                    `;
                    
                    document.getElementById('importBtnFallback').addEventListener('click', function(e) {
                        setTimeout(() => {
                            showNoHappMessage();
                        }, 3000);
                    });
                });

        } else {
            showError('Неверный формат подписки.');
        }
    }
</script>

</body>
</html>
