<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PC2 VPN - Импорт</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 28px;
            padding: 32px 24px 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        
        /* Логотип PC2 VPN */
        .logo-wrap {
            width: 80px;
            height: 80px;
            margin: 0 auto 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: transparent;
        }
        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #fff 50%, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.45);
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.2px;
            margin-bottom: 24px;
        }
        
        /* Buttons */
        .btn-primary {
            display: block;
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 8px 28px rgba(124, 58, 237, 0.3);
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        
        .btn-secondary {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            text-align: center;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-secondary:active { background: rgba(255, 255, 255, 0.06); }
        .btn-secondary svg {
            width: 18px;
            height: 18px;
            stroke: rgba(255, 255, 255, 0.5);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        
        /* Google Play Button */
        .google-play-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #1a1a2e;
            color: #fff;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .google-play-btn:active { transform: scale(0.97); }
        .google-play-btn .gp-logo {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .google-play-btn .gp-logo img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        .google-play-btn .btn-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.2;
        }
        .google-play-btn .btn-text .small {
            font-size: 10px;
            font-weight: 400;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .google-play-btn .btn-text .big {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }
        
        /* Cards */
        .card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 18px 16px;
            margin: 16px 0 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: left;
        }
        .card-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }
        .card-row + .card-row {
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 10px;
            margin-top: 4px;
        }
        .card-label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-label svg {
            width: 16px;
            height: 16px;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        .card-value {
            font-size: 14px;
            font-weight: 600;
        }
        .card-value.active { color: #34d399; }
        .card-value.expired { color: #f87171; }
        
        /* Progress */
        .progress-wrap {
            margin: 14px 0 18px;
        }
        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #7c3aed, #a855f7);
            transition: width 0.6s ease;
        }
        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 5px;
        }
        
        /* Error */
        .error-box {
            background: rgba(248, 113, 113, 0.08);
            border: 1px solid rgba(248, 113, 113, 0.12);
            border-radius: 14px;
            padding: 14px 16px;
            margin: 12px 0 16px;
            color: #fca5a5;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .error-box svg {
            width: 20px;
            height: 20px;
            stroke: #f87171;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        
        /* Loader */
        .loader-wrap {
            text-align: center;
            padding: 24px 0 12px;
        }
        .loader {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.06);
            border-top: 3px solid #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loader-text {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            font-weight: 400;
        }
        
        /* Happ logo in card - только здесь */
        .happ-logo-small {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            margin: 0 auto 12px;
            display: block;
            background: #fff;
            padding: 6px;
            object-fit: contain;
        }
        
        /* Footer */
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.12);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Логотип PC2 VPN -->
    <div class="logo-wrap">
        <img src="https://he02-asc.c6t.ru/logo.png" alt="PC2 VPN">
    </div>
    <h1>PC2 VPN</h1>
    <p class="subtitle">Импорт подписки для Pixel Combats 2</p>

    <div id="content"></div>

    <div class="footer">Pixel Combats 2 VPN • Бесплатно</div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    let subValue = urlParams.get('sub');

    // SVG Icons
    const icons = {
        download: `<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
        refresh: `<svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
        alert: `<svg viewBox="0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
        calendar: `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
        package: `<svg viewBox="0 0 24 24"><path d="M12.89 1.45l8 4A2 2 0 0 1 22 7.24v9.53a2 2 0 0 1-1.11 1.79l-8 4a2 2 0 0 1-1.79 0l-8-4a2 2 0 0 1-1.1-1.8V7.24a2 2 0 0 1 1.11-1.79l8-4a2 2 0 0 1 1.78 0z"/><polyline points="2.32 6.16 12 11 21.68 6.16"/><line x1="12" y1="22.76" x2="12" y2="11"/></svg>`,
        status: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>`
    };

    function showError(message) {
        document.getElementById('content').innerHTML = `
            <div class="error-box">
                ${icons.alert}
                <span>${message}</span>
            </div>
            <button class="btn-primary" onclick="window.location.reload()">
                ${icons.refresh} Попробовать снова
            </button>
        `;
    }

    function showNoHappMessage() {
        document.getElementById('content').innerHTML = `
            <div class="card" style="text-align:center; padding:24px 16px;">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQpat9S_dAeH4hCbL0_ijD7nDuJ6Swas51xV1XJSu02ew&s" 
                     alt="HAPP" class="happ-logo-small">
                <p style="color:rgba(255,255,255,0.7); font-size:15px; line-height:1.5;">
                    У вас не установлено приложение <strong>HAPP</strong>.<br>
                    Оно необходимо для импорта подписки.
                </p>
            </div>

            <a href="https://play.google.com/store/apps/details?id=com.happproxy" 
               class="google-play-btn" target="_blank">
                <span class="gp-logo">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT3AXznj8sia-k1hwg6DI2ejgBiBDe0NCdxMj7xUYSCWg&s" alt="Google Play">
                </span>
                <span class="btn-text">
                    <span class="small">Доступно в</span>
                    <span class="big">Google Play</span>
                </span>
            </a>

            <div style="margin-top:14px; font-size:13px; color:rgba(255,255,255,0.2);">
                После установки нажмите кнопку ниже
            </div>
            <button class="btn-secondary" id="retryBtn">
                ${icons.refresh} Повторить импорт
            </button>
        `;

        document.getElementById('retryBtn').addEventListener('click', function() {
            window.location.href = subValue;
            setTimeout(() => { showNoHappMessage(); }, 2000);
        });
    }

    if (!subValue) {
        showError('Не указана подписка.');
    } else {
        try { subValue = decodeURIComponent(subValue); } catch(e) {}

        if (subValue.startsWith('happ://')) {
            document.getElementById('content').innerHTML = `
                <div style="text-align:center; padding:12px 0 8px;">
                    <p style="color:rgba(255,255,255,0.5); font-size:14px; margin-bottom:16px;">
                        Нажмите кнопку, чтобы импортировать подписку
                    </p>
                    <a href="${subValue}" class="btn-primary" id="importBtn">
                        ${icons.download} Импортировать в HAPP
                    </a>
                </div>
            `;

            document.getElementById('importBtn').addEventListener('click', function(e) {
                setTimeout(() => { showNoHappMessage(); }, 3000);
            });

        } else if (subValue.startsWith('http://') || subValue.startsWith('https://')) {
            document.getElementById('content').innerHTML = `
                <div class="loader-wrap">
                    <div class="loader"></div>
                    <div class="loader-text">Загрузка подписки...</div>
                </div>
            `;

            fetch(subValue + '?format=info')
                .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                .then(data => {
                    const isActive = data.enable !== false;
                    const total = data.totalGB ? (data.totalGB / 1024 / 1024 / 1024).toFixed(1) : 10;
                    const used = data.usedGB ? data.usedGB.toFixed(1) : 0;
                    const progress = Math.min((used / total) * 100, 100);

                    document.getElementById('content').innerHTML = `
                        <div class="card">
                            <div class="card-row">
                                <span class="card-label">${icons.status} Статус</span>
                                <span class="card-value ${isActive ? 'active' : 'expired'}">${isActive ? '● Активна' : '● Истекла'}</span>
                            </div>
                            <div class="card-row">
                                <span class="card-label">${icons.calendar} Действует до</span>
                                <span class="card-value">${data.expiryTime ? new Date(data.expiryTime).toLocaleDateString('ru-RU') : '—'}</span>
                            </div>
                            <div class="card-row">
                                <span class="card-label">${icons.package} Пакет</span>
                                <span class="card-value">${total} ГБ</span>
                            </div>
                        </div>

                        <div class="progress-wrap">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width:${progress}%;"></div>
                            </div>
                            <div class="progress-labels">
                                <span>${used} ГБ</span>
                                <span>${total} ГБ</span>
                            </div>
                        </div>

                        <a href="${subValue}" class="btn-primary" id="importBtnHttp">
                            ${icons.download} Импортировать
                        </a>
                    `;

                    document.getElementById('importBtnHttp').addEventListener('click', function() {
                        setTimeout(() => { showNoHappMessage(); }, 3000);
                    });
                })
                .catch(() => {
                    document.getElementById('content').innerHTML = `
                        <div style="text-align:center; padding:12px 0 8px;">
                            <p style="color:rgba(255,255,255,0.5); font-size:14px; margin-bottom:16px;">
                                Нажмите кнопку, чтобы импортировать подписку
                            </p>
                            <a href="${subValue}" class="btn-primary" id="importBtnFallback">
                                ${icons.download} Импортировать
                            </a>
                        </div>
                    `;
                    document.getElementById('importBtnFallback').addEventListener('click', function() {
                        setTimeout(() => { showNoHappMessage(); }, 3000);
                    });
                });

        } else {
            showError('Неверный формат подписки.');
        }
    }
</script>

</body>
</html>
